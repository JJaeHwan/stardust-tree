<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>별가루 트리</title>
<meta name="description" content="빛 입자 수천 개로 만든 3D 크리스마스 트리. 누르거나 손을 펴면 흩어졌다가 메시지로 모여요.">
<meta property="og:type" content="website">
<meta property="og:title" content="별가루 트리">
<meta property="og:description" content="톡 누르거나 카메라 앞에서 손을 펴 보세요. 트리가 흩어졌다가 메시지로 모여요.">
<meta property="og:url" content="https://jjaehwan.github.io/stardust-tree/">
<meta property="og:image" content="https://jjaehwan.github.io/stardust-tree/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#03060d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l3.9 9.1 9.9.9-7.5 6.5 2.3 9.7L16 23.1l-8.6 5.1 2.3-9.7L2.2 12l9.9-.9z' fill='%23f2c46d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500&display=swap">
<style>
/* Layout: 화면 전체가 밤하늘 캔버스이고, 위에는 이름·카운트다운과 카메라 미리보기, 아래에는 안내와 버튼만 얹는다 */
:root {
  --night-lo: #03060d;
  --snow: #ebe6d9;
  --mist: #8f98ae;
  --gold: #f2c46d;
  --gold-line: rgba(242, 196, 109, 0.4);
  --mist-line: rgba(143, 152, 174, 0.45);
  --glass: rgba(9, 16, 32, 0.6);
  --font-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--night-lo);
  color: var(--snow);
  font-family: var(--font-body);
  -webkit-tap-highlight-color: transparent;
}
#scene {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: grab;
}
#scene.dragging { cursor: grabbing; }
.ui {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding-top: calc(18px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.top { display: grid; gap: 4px; justify-items: start; }
.brand {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.2rem;
  letter-spacing: 0.03em;
  color: var(--gold);
}
.count {
  margin: 0;
  font-size: 0.82rem;
  color: var(--mist);
  font-variant-numeric: tabular-nums;
}
.bottom {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px 16px;
}
.hint {
  margin: 0;
  flex: 1 1 13rem;
  min-width: 0;
  font-size: 0.8rem;
  line-height: 1.55;
  color: var(--mist);
}
.actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
  margin-left: auto;
}
.btn {
  pointer-events: auto;
  font: 500 0.95rem/1 var(--font-body);
  color: var(--snow);
  background: var(--glass);
  border: 1px solid var(--gold-line);
  border-radius: 999px;
  padding: 13px 20px;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  cursor: pointer;
  transition: border-color 0.2s ease;
}
.btn:hover { border-color: var(--gold); }
.btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.btn:disabled { opacity: 0.6; cursor: progress; }
.btn-quiet { background: transparent; border-color: var(--mist-line); }
.cam {
  position: fixed;
  top: calc(16px + env(safe-area-inset-top, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  justify-items: end;
  gap: 6px;
  pointer-events: none;
}
#cam-video {
  width: clamp(96px, 22vw, 168px);
  aspect-ratio: 4 / 3;
  object-fit: cover;
  transform: scaleX(-1);
  border-radius: 12px;
  border: 1px solid var(--gold-line);
  background: var(--night-lo);
  opacity: 0.85;
}
.cam p {
  margin: 0;
  max-width: 11rem;
  font-size: 0.75rem;
  line-height: 1.45;
  text-align: right;
  color: var(--mist);
}
#cam-state { color: var(--gold); }
#fallback {
  position: fixed;
  inset: 0;
  display: grid;
  place-content: center;
  gap: 12px;
  text-align: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#fallback-msg {
  margin: 0;
  font-family: var(--font-display);
  font-size: clamp(2.4rem, 12vw, 5rem);
  line-height: 1.1;
  color: var(--gold);
  text-wrap: balance;
}
#fallback p:last-child { margin: 0; color: var(--mist); font-size: 0.85rem; }
</style>
</head>
<body>

<canvas id="scene" role="img" aria-label="빛 입자 수천 개로 만든 3D 크리스마스 트리"></canvas>

<div class="ui">
  <header class="top">
    <p class="brand">별가루 트리</p>
    <p class="count" id="count">크리스마스까지 며칠 남았는지 세는 중</p>
  </header>
  <footer class="bottom">
    <p class="hint" id="hint">화면을 톡 누르면 트리가 흩어졌다가 메시지로 모여요. 좌우로 끌면 트리가 돌아가요.</p>
    <div class="actions">
      <button class="btn btn-quiet" id="cam-toggle" type="button" aria-pressed="false">손으로 조작</button>
      <button class="btn" id="toggle" type="button" aria-pressed="false">메시지 펼치기</button>
    </div>
  </footer>
</div>

<div class="cam" id="cam" hidden>
  <video id="cam-video" playsinline muted></video>
  <p id="cam-status"></p>
  <p id="cam-state" hidden></p>
</div>

<div id="fallback" hidden>
  <p id="fallback-msg"></p>
  <p>이 브라우저에서는 3D 트리를 그릴 수 없어서 메시지만 보여 드려요.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  // 트리가 흩어진 뒤 모이는 글자. 줄마다 한 항목.
  const MESSAGE = ["메리", "크리스마스"];

  const canvas = document.getElementById("scene");
  const toggleBtn = document.getElementById("toggle");
  const camBtn = document.getElementById("cam-toggle");
  const hintEl = document.getElementById("hint");
  const countEl = document.getElementById("count");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  countEl.textContent = countdownText(new Date());

  function countdownText(now) {
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    let xmas = new Date(now.getFullYear(), 11, 25);
    if (today > xmas) xmas = new Date(now.getFullYear() + 1, 11, 25);
    const days = Math.round((xmas - today) / 86400000);
    return days === 0 ? "오늘은 크리스마스" : `크리스마스까지 ${days}일`;
  }

  function showFallback() {
    document.getElementById("fallback-msg").textContent = MESSAGE.join(" ");
    document.getElementById("fallback").hidden = false;
    canvas.hidden = true;
    toggleBtn.hidden = true;
    camBtn.hidden = true;
    hintEl.hidden = true;
  }

  if (!window.THREE) { showFallback(); return; }

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: "high-performance" });
  } catch (err) {
    showFallback();
    return;
  }
  renderer.setClearColor(0x03060d, 1);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
  const CAM_Y = 0.35;
  const view = { w: 1, h: 1 };

  // ---------- 입자 배치 ----------
  const R = Math.random;
  const pick = (arr) => arr[(R() * arr.length) | 0];
  const small = Math.min(innerWidth, innerHeight) < 600;
  const N = small ? 7000 : 11000;
  const TREE_H = 8.8;
  const TREE_R = 3.3;
  const Y0 = -4.4;

  const PINES = [[0.07, 0.36, 0.19], [0.11, 0.48, 0.26], [0.05, 0.27, 0.16], [0.17, 0.56, 0.32]];
  const GOLD = [1.0, 0.76, 0.36];
  const WARM = [1.0, 0.9, 0.72];
  const RED = [0.95, 0.2, 0.26];
  const ICE = [0.6, 0.76, 1.0];

  const tree = new Float32Array(N * 3);
  const scatter = new Float32Array(N * 3);
  const text = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const tcol = new Float32Array(N * 3);
  const size = new Float32Array(N);
  const phase = new Float32Array(N);
  const spin = new Float32Array(N);
  // 1 이면 자리 잡은 뒤에도 코드 글자로 남고, 0 이면 빛 점(전구·오너먼트·별)이 된다
  const code = new Float32Array(N);

  const setV = (arr, i, x, y, z) => { arr[i * 3] = x; arr[i * 3 + 1] = y; arr[i * 3 + 2] = z; };
  const setC = (arr, i, c, k) => { arr[i * 3] = c[0] * k; arr[i * 3 + 1] = c[1] * k; arr[i * 3 + 2] = c[2] * k; };
  // 층마다 아래쪽 가지가 더 넓게 퍼지도록 반지름을 톱니 모양으로 조절
  const tierAt = (h) => 1 - 0.22 * ((h * 6.5) % 1);

  let i = 0;
  const until = (fraction) => Math.min(N, i + Math.round(N * fraction));

  // 가지: 원뿔 표면 근처에 몰리도록
  for (const stop = until(0.66); i < stop; i++) {
    const h = 1 - Math.sqrt(R());
    const r = TREE_R * (1 - h) * tierAt(h) * (0.5 + 0.5 * Math.sqrt(R()));
    const a = R() * Math.PI * 2;
    setV(tree, i, Math.cos(a) * r, Y0 + h * TREE_H, Math.sin(a) * r);
    const roll = R();
    if (roll < 0.06) { setC(col, i, WARM, 0.45); size[i] = 70 + R() * 30; }
    // 읽히는 크기의 코드 글자는 일부만 두고, 나머지는 작고 어두운 점으로 트리 부피만 채운다
    else if (roll < 0.38) { setC(col, i, pick(PINES), 1.0 + R() * 0.5); size[i] = 60; code[i] = 1; }
    else { setC(col, i, pick(PINES), 0.18 + R() * 0.22); size[i] = 34 + R() * 26; }
    spin[i] = 1;
  }
  // 전구 줄: 두 가닥이 나선으로 감긴다
  for (const stop = until(0.14); i < stop; i++) {
    const strand = R() < 0.5 ? 0 : Math.PI;
    const h = 1 - Math.pow(R(), 0.75);
    const a = h * 5.5 * Math.PI * 2 + strand + (R() - 0.5) * 0.08;
    const r = TREE_R * (1 - h) * tierAt(h) * 1.03 + 0.06;
    setV(tree, i, Math.cos(a) * r, Y0 + h * TREE_H + (R() - 0.5) * 0.05, Math.sin(a) * r);
    setC(col, i, R() < 0.55 ? GOLD : WARM, 0.45 + R() * 0.3);
    size[i] = 85 + R() * 55;
    spin[i] = 1;
  }
  // 오너먼트 공
  for (const stop = until(0.025); i < stop; i++) {
    const h = 0.04 + (1 - Math.sqrt(R())) * 0.86;
    const a = R() * Math.PI * 2;
    const r = TREE_R * (1 - h) * tierAt(h);
    setV(tree, i, Math.cos(a) * r, Y0 + h * TREE_H, Math.sin(a) * r);
    const roll = R();
    setC(col, i, roll < 0.5 ? RED : roll < 0.8 ? GOLD : ICE, 0.7);
    size[i] = 170 + R() * 90;
    spin[i] = 1;
  }
  // 꼭대기 별: 항상 정면을 본다. 마지막 3개는 별 주위 후광
  const starY = Y0 + TREE_H + 0.42;
  for (const stop = until(0.025); i < stop; i++) {
    if (stop - i <= 3) {
      setV(tree, i, 0, starY, 0);
      setC(col, i, GOLD, 0.2);
      size[i] = 900;
    } else {
      const th = R() * Math.PI * 2;
      const rb = 0.22 + 0.36 * Math.pow(Math.abs(Math.cos(2.5 * (th - Math.PI / 2))), 2);
      const rr = rb * Math.sqrt(R());
      setV(tree, i, Math.cos(th) * rr, starY + Math.sin(th) * rr, (R() - 0.5) * 0.08);
      setC(col, i, R() < 0.6 ? GOLD : WARM, 0.6 + R() * 0.3);
      size[i] = 75 + R() * 45;
    }
    spin[i] = 0;
  }
  // 바닥에 깔린 눈빛
  for (const stop = until(0.08); i < stop; i++) {
    const a = R() * Math.PI * 2;
    const r = TREE_R * 1.75 * Math.pow(R(), 0.55);
    setV(tree, i, Math.cos(a) * r, Y0 - 0.2 + (R() - 0.5) * 0.06, Math.sin(a) * r);
    setC(col, i, R() < 0.7 ? ICE : WARM, 0.15 + R() * 0.2);
    size[i] = 45 + R() * 35;
    spin[i] = 1;
    code[i] = 1;
  }
  // 트리 주변을 떠다니는 반짝이
  for (; i < N; i++) {
    const a = R() * Math.PI * 2;
    const r = 2.2 + R() * 4.2;
    setV(tree, i, Math.cos(a) * r, Y0 - 0.2 + R() * (TREE_H + 1.2), Math.sin(a) * r);
    setC(col, i, R() < 0.5 ? GOLD : WARM, 0.15 + R() * 0.25);
    size[i] = 30 + R() * 40;
    spin[i] = 1;
    code[i] = 1;
  }
  // 공통: 흩어질 방향, 글자일 때 색, 반짝임 위상
  for (let k = 0; k < N; k++) {
    phase[k] = R();
    const u = R() * 2 - 1;
    const t = R() * Math.PI * 2;
    const s = Math.sqrt(1 - u * u);
    const m = 2.5 + R() * 5.5;
    setV(scatter, k, Math.cos(t) * s * m, u * m, Math.sin(t) * s * m);
    const roll = R();
    if (roll < 0.05) setC(tcol, k, RED, 0.5);
    else if (roll < 0.09) setC(tcol, k, PINES[3], 0.6);
    else setC(tcol, k, R() < 0.6 ? GOLD : WARM, 0.32 + R() * 0.24);
  }
  text.set(tree);

  // 쌓기 연출: 입자마다 위에서 떨어지기 시작하는 시각과 낙하 시간. 낮은 곳부터 닿아 아래에서 위로 쌓인다
  const BUILD_SPAN = 4.6;
  const GLYPH_COUNT = 32;
  const land = new Float32Array(N);
  const fall = new Float32Array(N);
  const drop = new Float32Array(N);
  const glyph = new Float32Array(N);
  const yLow = Y0 - 0.3;
  const yHigh = starY + 0.6;
  let buildEnd = 0;
  for (let k = 0; k < N; k++) {
    const hN = (tree[k * 3 + 1] - yLow) / (yHigh - yLow);
    land[k] = spin[k] === 0 ? BUILD_SPAN + 1.0 + R() * 0.3 : 0.5 + hN * BUILD_SPAN + R() * 0.7;
    fall[k] = 0.9 + R() * 0.7;
    drop[k] = R() * 1.5;
    glyph[k] = (R() * GLYPH_COUNT) | 0;
    buildEnd = Math.max(buildEnd, land[k]);
  }
  buildEnd += 0.7;

  function makeGlyphTexture() {
    const chars = Array.from("{}[]()<>/;:=+-*&|!?#$%01xyifor._");
    const cell = 64;
    const cols = 8;
    const rows = GLYPH_COUNT / cols;
    const c = document.createElement("canvas");
    c.width = cell * cols;
    c.height = cell * rows;
    const g = c.getContext("2d");
    g.fillStyle = "#fff";
    g.font = `bold ${Math.round(cell * 0.74)}px "SF Mono", Menlo, Consolas, "Courier New", monospace`;
    g.textAlign = "center";
    g.textBaseline = "middle";
    chars.forEach((ch, k) => g.fillText(ch, (k % cols + 0.5) * cell, (Math.floor(k / cols) + 0.54) * cell));
    const tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearMipmapLinearFilter;
    tex.magFilter = THREE.LinearFilter;
    return tex;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(tree, 3));
  const textAttr = new THREE.BufferAttribute(text, 3);
  geo.setAttribute("aText", textAttr);
  geo.setAttribute("aScatter", new THREE.BufferAttribute(scatter, 3));
  geo.setAttribute("aColor", new THREE.BufferAttribute(col, 3));
  geo.setAttribute("aTextColor", new THREE.BufferAttribute(tcol, 3));
  geo.setAttribute("aSize", new THREE.BufferAttribute(size, 1));
  geo.setAttribute("aPhase", new THREE.BufferAttribute(phase, 1));
  geo.setAttribute("aSpin", new THREE.BufferAttribute(spin, 1));
  geo.setAttribute("aLand", new THREE.BufferAttribute(land, 1));
  geo.setAttribute("aFall", new THREE.BufferAttribute(fall, 1));
  geo.setAttribute("aDrop", new THREE.BufferAttribute(drop, 1));
  geo.setAttribute("aGlyph", new THREE.BufferAttribute(glyph, 1));
  geo.setAttribute("aCode", new THREE.BufferAttribute(code, 1));

  const BUILD_DONE = 1e4;
  const pu = {
    uTime: { value: 0 },
    uMorph: { value: 0 },
    uRot: { value: 0 },
    uScale: { value: 1 },
    uPR: { value: 1 },
    uTwinkle: { value: reduceMotion ? 0.15 : 0.45 },
    uBuild: { value: reduceMotion ? BUILD_DONE : 0 },
    uTopY: { value: 8 },
    uGlyphs: { value: makeGlyphTexture() },
  };

  const points = new THREE.Points(geo, new THREE.ShaderMaterial({
    uniforms: pu,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: `
      uniform float uTime;
      uniform float uMorph;
      uniform float uRot;
      uniform float uScale;
      uniform float uPR;
      uniform float uTwinkle;
      uniform float uBuild;
      uniform float uTopY;
      attribute vec3 aText;
      attribute vec3 aScatter;
      attribute vec3 aColor;
      attribute vec3 aTextColor;
      attribute float aSize;
      attribute float aPhase;
      attribute float aSpin;
      attribute float aLand;
      attribute float aFall;
      attribute float aDrop;
      attribute float aGlyph;
      attribute float aCode;
      varying vec3 vColor;
      varying float vAlpha;
      varying float vGlyph;
      varying float vGlyphIdx;

      vec3 rotY(vec3 p, float a) {
        float c = cos(a);
        float s = sin(a);
        return vec3(c * p.x + s * p.z, p.y, -s * p.x + c * p.z);
      }

      void main() {
        // 입자마다 출발 시각을 조금씩 늦춰 파도처럼 흩어지고 모이게 한다
        float m = clamp((uMorph - aPhase * 0.35) / 0.65, 0.0, 1.0);
        float e = m * m * (3.0 - 2.0 * m);
        vec3 t = mix(position, rotY(position, uRot), aSpin);
        // 쌓기: 화면 위에서 코드 글자로 떨어지다가(가속) 제자리에 닿으면 빛 입자로 바뀐다
        float since = uBuild - aLand;
        float fallP = clamp((uBuild - (aLand - aFall)) / aFall, 0.0, 1.0);
        t.y = mix(uTopY + aDrop, t.y, fallP * fallP);
        float shown = step(aLand - aFall, uBuild);
        float landMix = 1.0 - clamp(since / 0.6, 0.0, 1.0);
        float glyphMix = max(landMix, aCode);
        float flash = since >= 0.0 ? exp(-since * 5.0) : 0.0;
        t.y += sin(uTime * 0.9 + aPhase * 40.0) * 0.025;
        vec3 x = aText + vec3(sin(uTime * 1.7 + aPhase * 50.0), cos(uTime * 1.3 + aPhase * 70.0), 0.0) * 0.018;
        vec3 p = mix(t, x, e) + aScatter * sin(3.14159265 * e);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        float tw = 1.0 - uTwinkle * (0.5 + 0.5 * sin(uTime * (1.2 + aPhase * 3.5) + aPhase * 91.0));
        float settled = mix(mix(aSize, 62.0, e), mix(190.0, 110.0, e), aCode);
        float sz = mix(settled, 170.0, landMix);
        gl_PointSize = sz * uScale * uPR * (0.85 + 0.3 * tw) / -mv.z;
        vColor = mix(aColor, aTextColor, e) * (1.0 + landMix * 0.9 + flash * 1.6);
        vAlpha = tw * shown;
        vGlyph = glyphMix;
        // 떨어지는 동안에는 글자가 빠르게 바뀌고, 코드로 남는 입자는 자리 잡은 뒤에도 몇 초에 한 번씩 바뀐다
        float flicker = since < 0.0 ? 7.0 : 0.3 * aCode;
        vGlyphIdx = mod(aGlyph + floor(uTime * flicker + aPhase * 13.0), 32.0);
      }
    `,
    fragmentShader: `
      uniform sampler2D uGlyphs;
      varying vec3 vColor;
      varying float vAlpha;
      varying float vGlyph;
      varying float vGlyphIdx;
      void main() {
        vec2 pc = gl_PointCoord;
        float d = length(pc - 0.5);
        float dotShape = d < 0.5 ? pow(1.0 - d * 2.0, 2.2) + smoothstep(0.16, 0.0, d) * 0.9 : 0.0;
        float idx = floor(vGlyphIdx + 0.5);
        vec2 cell = vec2(mod(idx, 8.0), floor(idx / 8.0));
        float glyphShape = texture2D(uGlyphs, vec2((cell.x + pc.x) / 8.0, 1.0 - (cell.y + pc.y) / 4.0)).a * 1.3;
        float shape = mix(dotShape, glyphShape, vGlyph);
        if (shape < 0.004) discard;
        gl_FragColor = vec4(vColor * shape * vAlpha, 1.0);
      }
    `,
  }));
  points.frustumCulled = false;

  // ---------- 눈 ----------
  const SN = small ? 260 : 480;
  const snowPos = new Float32Array(SN * 3);
  const snowSeed = new Float32Array(SN * 3);
  for (let k = 0; k < SN; k++) {
    snowPos[k * 3 + 2] = -7 + R() * 11;
    snowSeed[k * 3] = R() * 2 - 1;
    snowSeed[k * 3 + 1] = R() * 100;
    snowSeed[k * 3 + 2] = R();
  }
  const snowGeo = new THREE.BufferGeometry();
  snowGeo.setAttribute("position", new THREE.BufferAttribute(snowPos, 3));
  snowGeo.setAttribute("aSeed", new THREE.BufferAttribute(snowSeed, 3));
  const su = {
    uTime: { value: 0 },
    uW: { value: 20 },
    uH: { value: 14 },
    uCY: { value: CAM_Y },
    uScale: { value: 1 },
    uPR: { value: 1 },
    uFall: { value: reduceMotion ? 0.3 : 1 },
  };
  const snow = new THREE.Points(snowGeo, new THREE.ShaderMaterial({
    uniforms: su,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: `
      uniform float uTime;
      uniform float uW;
      uniform float uH;
      uniform float uCY;
      uniform float uScale;
      uniform float uPR;
      uniform float uFall;
      attribute vec3 aSeed;
      varying float vA;
      void main() {
        float depth = (position.z + 7.0) / 11.0;
        float y = mod(aSeed.y - uTime * (0.35 + aSeed.z * 0.45) * uFall, uH) - uH * 0.5 + uCY;
        float x = aSeed.x * uW * 0.5 + sin(uTime * 0.5 + aSeed.y) * 0.35;
        vec4 mv = modelViewMatrix * vec4(x, y, position.z, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = (22.0 + aSeed.z * 30.0) * uScale * uPR / -mv.z;
        vA = 0.22 + 0.33 * depth;
      }
    `,
    fragmentShader: `
      varying float vA;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        if (d > 0.5) discard;
        float g = pow(1.0 - d * 2.0, 1.8);
        gl_FragColor = vec4(vec3(0.85, 0.9, 1.0) * g * vA, 1.0);
      }
    `,
  }));
  snow.frustumCulled = false;

  // ---------- 밤하늘 배경 ----------
  const bgU = { uAspect: { value: 1 } };
  const bg = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
    uniforms: bgU,
    depthTest: false,
    depthWrite: false,
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position.xy, 0.999, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uAspect;
      varying vec2 vUv;
      float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
      void main() {
        vec2 q = (vUv - vec2(0.5, 0.95)) * vec2(uAspect, 1.0);
        vec3 hi = vec3(0.055, 0.105, 0.205);
        vec3 lo = vec3(0.012, 0.022, 0.05);
        vec3 c = mix(hi, lo, smoothstep(0.0, 1.15, length(q)));
        c += (hash(gl_FragCoord.xy) - 0.5) / 255.0;
        gl_FragColor = vec4(c, 1.0);
      }
    `,
  }));
  bg.frustumCulled = false;
  bg.renderOrder = -1;

  scene.add(bg, snow, points);

  // ---------- 화면 맞춤 ----------
  function layout() {
    const w = innerWidth;
    const h = innerHeight;
    const pr = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(pr);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    const t = Math.tan(camera.fov * Math.PI / 360);
    // 세로로는 바닥~별, 가로로는 트리 폭이 들어오는 거리 중 먼 쪽
    const dist = Math.max(6.3 / t, 4.4 / (t * camera.aspect));
    camera.position.set(0, CAM_Y, dist);
    camera.lookAt(0, CAM_Y, 0);
    camera.updateProjectionMatrix();
    view.h = 2 * dist * t;
    view.w = view.h * camera.aspect;
    const scale = 0.0013 * h / (2 * t);
    pu.uScale.value = scale;
    pu.uPR.value = pr;
    pu.uTopY.value = CAM_Y + view.h / 2 + 0.4;
    su.uScale.value = scale;
    su.uPR.value = pr;
    su.uW.value = view.w * 1.4;
    su.uH.value = view.h * 1.25;
    bgU.uAspect.value = camera.aspect;
  }

  // 글자를 보이지 않는 캔버스에 그린 뒤 칠해진 픽셀 좌표를 입자의 목적지로 쓴다
  function buildText() {
    const c = document.createElement("canvas");
    const ctx = c.getContext("2d", { willReadFrequently: true });
    const font = '200px "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
    const lineH = 230;
    const pad = 24;
    ctx.font = font;
    const tw = Math.ceil(Math.max(...MESSAGE.map((l) => ctx.measureText(l).width))) + pad * 2;
    const th = MESSAGE.length * lineH + pad * 2;
    c.width = tw;
    c.height = th;
    ctx.font = font;
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    MESSAGE.forEach((line, k) => ctx.fillText(line, tw / 2, pad + lineH * (k + 0.5)));
    const img = ctx.getImageData(0, 0, tw, th).data;
    const step = 3;
    const pts = [];
    for (let y = 0; y < th; y += step) {
      for (let x = 0; x < tw; x += step) {
        if (img[(y * tw + x) * 4 + 3] > 140) pts.push(x, y);
      }
    }
    if (!pts.length) return;
    const s = Math.min((view.w * 0.84) / tw, (view.h * 0.4) / th);
    const count = pts.length / 2;
    for (let k = 0; k < N; k++) {
      const j = ((R() * count) | 0) * 2;
      text[k * 3] = (pts[j] + R() * step - tw / 2) * s;
      text[k * 3 + 1] = -(pts[j + 1] + R() * step - th / 2) * s + CAM_Y;
      text[k * 3 + 2] = (R() - 0.5) * 0.35;
    }
    textAttr.needsUpdate = true;
  }

  layout();
  buildText();
  if (document.fonts && document.fonts.load) {
    Promise.race([
      document.fonts.load('200px "Black Han Sans"', MESSAGE.join("")),
      new Promise((resolve) => setTimeout(resolve, 3000)),
    ]).then(buildText, buildText);
  }

  let resizeTimer;
  addEventListener("resize", () => {
    layout();
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(buildText, 150);
  });

  // ---------- 탭·드래그 조작 ----------
  let showText = false;
  let morph = 0;
  let rot = 0;
  let rotVel = 0;
  let pressed = false;
  let dragging = false;
  let startX = 0;
  let startY = 0;
  let startT = 0;
  let lastX = 0;
  let lastT = 0;
  const clampVel = (v) => Math.max(-8, Math.min(8, v));

  // 트리가 다 쌓이기 전에는 메시지 전환을 받지 않는다 (회전은 된다)
  let building = !reduceMotion;
  let buildT = 0;
  const HINT = hintEl.textContent;
  if (building) {
    toggleBtn.disabled = true;
    hintEl.textContent = "코드가 떨어지면서 트리를 쌓는 중이에요.";
  }
  function finishBuild() {
    building = false;
    pu.uBuild.value = BUILD_DONE;
    toggleBtn.disabled = false;
    hintEl.textContent = HINT;
  }

  function setShowText(next) {
    if (building || showText === next) return;
    showText = next;
    toggleBtn.textContent = next ? "트리로 돌아가기" : "메시지 펼치기";
    toggleBtn.setAttribute("aria-pressed", String(next));
  }
  toggleBtn.addEventListener("click", () => setShowText(!showText));

  canvas.addEventListener("pointerdown", (e) => {
    pressed = true;
    dragging = false;
    startX = lastX = e.clientX;
    startY = e.clientY;
    startT = lastT = performance.now();
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!pressed) return;
    const now = performance.now();
    if (!dragging && Math.hypot(e.clientX - startX, e.clientY - startY) > 8) {
      dragging = true;
      canvas.classList.add("dragging");
    }
    if (dragging) {
      const k = 6 / Math.max(320, innerWidth);
      const d = (e.clientX - lastX) * k;
      rot += d;
      const sec = Math.max(1, now - lastT) / 1000;
      rotVel = clampVel(rotVel * 0.5 + (d / sec) * 0.5);
    }
    lastX = e.clientX;
    lastT = now;
  });
  const endPress = (cancelled) => {
    if (!pressed) return;
    pressed = false;
    if (!cancelled && !dragging && performance.now() - startT < 500) setShowText(!showText);
    if (dragging && performance.now() - lastT > 80) rotVel = 0;
    dragging = false;
    canvas.classList.remove("dragging");
  };
  canvas.addEventListener("pointerup", () => endPress(false));
  canvas.addEventListener("pointercancel", () => endPress(true));

  // ---------- 손 제스처 (웹캠 + MediaPipe) ----------
  // 손을 펴면 메시지, 주먹을 쥐면 트리. 트리일 때 손을 좌우로 움직이면 돌아간다.
  const MP_BASE = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
  const MP_MODEL = "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task";
  const camBox = document.getElementById("cam");
  const video = document.getElementById("cam-video");
  const camStatus = document.getElementById("cam-status");
  const camState = document.getElementById("cam-state");
  const GESTURE_LABEL = { Open_Palm: "손을 폈어요 · 메시지", Closed_Fist: "주먹 · 트리" };
  const STABLE_FRAMES = 5;

  let recognizer = null;
  let stream = null;
  let camOn = false;
  let lastVideoTime = -1;
  let handPresent = false;
  let prevHandX = null;
  let prevDetectT = 0;
  let gestureName = "None";
  let gestureCount = 0;
  let shownLabel = "";

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) camBtn.hidden = true;

  async function loadRecognizer() {
    const { FilesetResolver, GestureRecognizer } = await import(`${MP_BASE}/vision_bundle.mjs`);
    const fileset = await FilesetResolver.forVisionTasks(`${MP_BASE}/wasm`);
    const options = (delegate) => ({
      baseOptions: { modelAssetPath: MP_MODEL, delegate },
      runningMode: "VIDEO",
      numHands: 1,
    });
    try {
      return await GestureRecognizer.createFromOptions(fileset, options("GPU"));
    } catch (err) {
      return await GestureRecognizer.createFromOptions(fileset, options("CPU"));
    }
  }

  function setCamButton(on) {
    camBtn.textContent = on ? "카메라 끄기" : "손으로 조작";
    camBtn.setAttribute("aria-pressed", String(on));
  }

  function stopCamera(message) {
    if (stream) stream.getTracks().forEach((track) => track.stop());
    stream = null;
    camOn = false;
    handPresent = false;
    prevHandX = null;
    video.srcObject = null;
    camState.hidden = true;
    shownLabel = "";
    setCamButton(false);
    if (message) {
      video.hidden = true;
      camStatus.textContent = message;
      camBox.hidden = false;
    } else {
      camBox.hidden = true;
    }
  }

  async function startCamera() {
    camBtn.disabled = true;
    camBox.hidden = false;
    video.hidden = true;
    camState.hidden = true;
    camStatus.textContent = "브라우저에서 카메라 사용을 허용해 주세요.";
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false,
      });
    } catch (err) {
      camBtn.disabled = false;
      stopCamera(err && err.name === "NotAllowedError"
        ? "카메라 권한이 막혀 있어요. 화면 탭과 드래그로도 조작할 수 있어요."
        : "카메라를 열지 못했어요. 화면 탭과 드래그로도 조작할 수 있어요.");
      return;
    }
    video.srcObject = stream;
    video.hidden = false;
    try { await video.play(); } catch (err) { /* 일부 브라우저는 자동 재생을 늦게 허용한다. 다음 프레임에서 readyState 로 판단한다 */ }
    camStatus.textContent = "손 인식을 불러오는 중이에요. 처음 한 번은 조금 걸려요.";
    try {
      if (!recognizer) recognizer = await loadRecognizer();
    } catch (err) {
      camBtn.disabled = false;
      stopCamera("손 인식을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.");
      return;
    }
    camBtn.disabled = false;
    camOn = true;
    lastVideoTime = -1;
    setCamButton(true);
    camStatus.textContent = "손을 펴면 메시지, 주먹을 쥐면 트리예요. 손을 좌우로 움직이면 돌아가요.";
    camState.hidden = false;
    showGesture(null);
  }

  camBtn.addEventListener("click", () => {
    if (camOn) stopCamera();
    else startCamera();
  });

  function showGesture(name) {
    const label = name === null ? "손을 카메라에 보여 주세요" : (GESTURE_LABEL[name] || "손이 보여요");
    if (label !== shownLabel) {
      shownLabel = label;
      camState.textContent = label;
    }
  }

  function trackGesture(name) {
    if (name === gestureName) gestureCount++;
    else { gestureName = name; gestureCount = 1; }
    // 같은 동작이 몇 프레임 이어져야 바꾼다 (손을 바꾸는 중간 모양에 반응하지 않도록)
    if (gestureCount === STABLE_FRAMES) {
      if (name === "Open_Palm") setShowText(true);
      else if (name === "Closed_Fist") setShowText(false);
    }
  }

  function detect(now) {
    if (!camOn || !recognizer || video.readyState < 2) return;
    if (video.currentTime === lastVideoTime) return;
    lastVideoTime = video.currentTime;
    let result;
    try {
      result = recognizer.recognizeForVideo(video, now);
    } catch (err) {
      return;
    }
    const landmarks = result.landmarks && result.landmarks[0];
    if (!landmarks) {
      handPresent = false;
      prevHandX = null;
      trackGesture("None");
      showGesture(null);
      return;
    }
    handPresent = true;
    // 미리보기가 거울처럼 보이므로 x 를 뒤집는다. 9번은 가운뎃손가락 뿌리 관절
    const x = 1 - landmarks[9].x;
    if (prevHandX !== null && morph < 0.5) {
      const d = (x - prevHandX) * 7;
      const sec = Math.max(0.001, (now - prevDetectT) / 1000);
      rot += d;
      rotVel = clampVel(rotVel * 0.6 + (d / sec) * 0.4);
    }
    prevHandX = x;
    prevDetectT = now;
    const top = result.gestures && result.gestures[0] && result.gestures[0][0];
    const name = top && top.score > 0.55 ? top.categoryName : "None";
    trackGesture(name);
    showGesture(name);
  }

  // ---------- 그리기 ----------
  const AUTO_SPIN = reduceMotion ? 0 : 0.22;
  const MORPH_SECONDS = 2.4;
  let time = 0;
  let last = performance.now();

  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    time += dt;

    detect(now);

    if (building) {
      buildT += dt;
      pu.uBuild.value = buildT;
      if (buildT >= buildEnd) finishBuild();
    }

    const target = showText ? 1 : 0;
    const stepM = dt / MORPH_SECONDS;
    if (morph < target) morph = Math.min(target, morph + stepM);
    else if (morph > target) morph = Math.max(target, morph - stepM);

    if (!dragging && !handPresent) {
      rot += (AUTO_SPIN * (1 - morph) + rotVel) * dt;
      rotVel *= Math.exp(-2.2 * dt);
    }

    pu.uTime.value = time;
    pu.uMorph.value = morph;
    pu.uRot.value = rot;
    su.uTime.value = time;
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
